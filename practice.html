<section>
<h2>اليوم 1: أين يساعد الذكاء الاصطناعي في الموارد البشرية، وأين يدخل التحيز</h2>
<ol>
<li><p>أربعة طلبات وصلت إلى هبة في أسبوع واحد. أيها لا يُسلَّم للمساعد مهما كانت الأداة ومهما رُمّزت البيانات؟</p><ul><li><b>أ.</b> مسودة إعلان وظيفة من بطاقة الدور</li><li><b>ب.</b> اقتراحات تعلم من ملفات مهارات مرمَّزة</li><li><b>ج.</b> قائمة بمن يُدعى إلى المقابلة من درجات المساعد</li><li><b>د.</b> مسودة رسالة اعتذار لمتقدم لم تختره اللجنة</li></ul></li>
<li><p>بطاقة الدور: بكالوريوس في تخصص ذي صلة، وخبرة من سنة إلى ثلاث، واستعلام من قواعد البيانات بمستوى متقدم. أي سطر من إعلان منقَّح ما زال يحتاج إلى تغيير؟</p><ul><li><b>أ.</b> خمس شهادات مهنية سارية من مزوّدي أدوات التحليل</li><li><b>ب.</b> إتقان SQL وأداة واحدة للوحات المعلومات</li><li><b>ج.</b> بكالوريوس في تخصص ذي صلة، والماجستير مفضَّل</li><li><b>د.</b> خبرة من سنة إلى ثلاث سنوات في تحليل البيانات</li></ul></li>
<li><p>أربعة أزواج أُعدّت لاختبار أمر فرز. في كل زوج سيرتان. أي زوج لو اختلفت درجتاه لما عرفت السبب؟</p><ul><li><b>أ.</b> سيرتان تختلفان في الاسم الأول وحده: رامي وريما</li><li><b>ب.</b> سيرتان تختلفان في سنة الميلاد وفي سنوات الخبرة</li><li><b>ج.</b> سيرتان تختلفان في سنة الميلاد، والخبرة سنتان في الاثنتين</li><li><b>د.</b> سيرتان ضعيفتان تختلفان في الاسم الكامل وحده</li></ul></li>
<li><p>زوج يختلف في الاسم. النسخة المرجعية: 78 ثم 79. النسخة المعدَّلة: 78 ثم 74. تباين التشغيلين في الاختبار كله 2.15 نقطة. ما الذي يصح أن تكتبه عن هذا الزوج؟</p><ul><li><b>أ.</b> المساعد ينزل بالاسم المعدَّل خمس نقاط في كل تشغيل</li><li><b>ب.</b> لا فرق بين النسختين: الدرجة الأولى واحدة فيهما</li><li><b>ج.</b> متوسط الفرق 2.5 وهو أكبر من التباين، فالتحيز ثابت</li><li><b>د.</b> متوسط الفرق 2.5 نزولًا، ويُنظر في بقية الأزواج</li></ul></li>
<li><p>مديرة تعلم تطلب من المساعد المصرح به أن يلخص تعليقات استبيان الخروج بعد حذف الأسماء والإدارات منها، لتعرض المحاور على الإدارة. كيف يُصنَّف هذا الاستخدام؟</p><ul><li><b>أ.</b> قرار في شأن شخص: في التعليقات بيانات عن موظفين غادروا</li><li><b>ب.</b> يُقبل: المخرج محاور عامة تراجعها المديرة قبل العرض</li><li><b>ج.</b> ممنوع: استبيانات الخروج سرية ولا تدخل أي أداة مهما جُهّزت</li><li><b>د.</b> خارج التصنيف: تلخيص الاستبيانات ليس من مهام الموارد البشرية</li></ul></li>
<li><p>لماذا يُعد إعطاء المساعد العام درجة لكل سيرة عالي المخاطر، حتى لو قرأ مدير التوظيف القائمة بعد ذلك؟</p><ul><li><b>أ.</b> لأن المساعد يخطئ في قراءة السير الطويلة ويفوته بعض ما فيها</li><li><b>ب.</b> لأن السير تحتوي بيانات شخصية لا يجوز أن تدخل أي مساعد</li><li><b>ج.</b> لأن المساعد أبطأ من القراءة البشرية حين تكثر الطلبات</li><li><b>د.</b> لأن الدرجة تحدد من يُقابَل، ولم يُختبر تحيزها ولا تُشرح</li></ul></li>
<li><p>أداة كشف أعطت خطاب تقديم نسبة 91% «مولَّد». المرشح كتب بالإنجليزية وهي لغته الثانية. ما التصرف الذي يسنده الدليل؟</p><ul><li><b>أ.</b> لا يُبنى على النسبة شيء، وتُقاس مهارته بسؤال بمرتكزات في المقابلة</li><li><b>ب.</b> يُستبعد من الفرز: النسبة تتجاوز التسعين في المئة بوضوح</li><li><b>ج.</b> يُدعى ويُسأل في المقابلة: هل كتبت خطاب التقديم بنفسك؟</li><li><b>د.</b> تُخفَّض درجة خطابه قليلًا ولا يُستبعد، إنصافًا لبقية المتقدمين</li></ul></li>
<li><p>جهة قررت أن «إنسانًا يراجع» قائمة المرشحين التي يرتبها المساعد. بعد شهر تبيّن أن المراجِع وافق على كل القوائم كما وصلت. أي وصف أدق؟</p><ul><li><b>أ.</b> المراجعة تعمل كما أُريد لها: لم تجد في القوائم خطأ واحدًا</li><li><b>ب.</b> المساعد دقيق في هذه المهمة، والموافقات المتتالية تثبت ذلك</li><li><b>ج.</b> القرار عند المساعد فعلًا: المراجِع يصدّق مخرج النظام</li><li><b>د.</b> المشكلة في عدد المراجعين: مراجع واحد لا يكفي لقوائم كثيرة</li></ul></li>
<li><p>أي سطر من وصف وظيفي لمحاسب في مستواه الأول صياغة إقصائية، وليس متطلبًا مبالغًا فيه؟</p><ul><li><b>أ.</b> خبرة لا تقل عن عشر سنوات في المحاسبة</li><li><b>ب.</b> دكتوراه في المحاسبة أو المالية (شرط)</li><li><b>ج.</b> نبحث عن شاب نشيط ينضم إلى فريقنا</li><li><b>د.</b> سبع شهادات مهنية سارية في المحاسبة</li></ul></li>
<li><p>الأصل في وصف وظيفي: «رجل مبيعات قوي». أي صف من جدول التغييرات يُحتسب في دليل الناتج؟</p><ul><li><b>أ.</b> الجديد: «مندوب مبيعات متميز». السبب: الصياغة الجديدة أفضل وأوضح وأقصر من الأصل</li><li><b>ب.</b> الجديد: تُحذف العبارة. السبب: اقترح المساعد حذفها حين عُرض عليه الوصف كاملًا</li><li><b>ج.</b> الجديد: «رجل أو امرأة مبيعات قويان». السبب: الصياغة الجديدة تشمل الجنسين معًا</li><li><b>د.</b> الجديد: «يحقق أهداف المبيعات الفصلية». السبب: الأصل يخاطب الرجال ويصف صفة لا مهمة</li></ul></li>
<li><p>بطاقة الدور تقول: «الماجستير مفضَّل وليس شرطًا». المساعد كتب في الوصف: «ماجستير (شرط)». مدير التوظيف يقول: «اتركه، نريد الأفضل». ما أدق رد؟</p><ul><li><b>أ.</b> يُكتب مفضَّلًا كما في البطاقة، أو تُعدَّل البطاقة بسبب مكتوب</li><li><b>ب.</b> يُترك شرطًا كما هو: المدير صاحب القرار في متطلبات وظيفته</li><li><b>ج.</b> يُحذف ذكر الماجستير تمامًا حتى لا يستبعد الوصف أحدًا</li><li><b>د.</b> يُسأل المساعد أي الصيغتين أصح، ويُؤخذ بما يرجّحه</li></ul></li>
<li><p>ماذا وجدت الدراسة التجريبية عن الإعلانات التي تكثر فيها كلمات مثل «تنافسي» و«مسيطر»؟</p><ul><li><b>أ.</b> رأت النساء أنهن أقل مهارة من أن يتقدمن إلى الوظيفة</li><li><b>ب.</b> وجدت النساء الوظيفة أقل جاذبية، لشعور بعدم الانتماء</li><li><b>ج.</b> لم تتغير جاذبية الوظيفة عند النساء ولا عند الرجال</li><li><b>د.</b> زاد عدد المتقدمات لأن الإعلان بدا أقوى وأكثر جدية</li></ul></li>
<li><p>تريد اختبار أثر العمر في أمر فرز. أي زوج من السير يصلح؟</p><ul><li><b>أ.</b> سيرتان بسنتَي ميلاد مختلفتين، وتواريخ الخبرة فيهما تتبع العمر</li><li><b>ب.</b> سيرتان لموظفَين حقيقيين من عمرين مختلفين في الوظيفة نفسها</li><li><b>ج.</b> سيرة واحدة لمتقدم كبير السن تُشغَّل مرتين في محادثتين</li><li><b>د.</b> سيرتان تختلفان في سنة الميلاد وحدها، والخبرة فيهما مدة واحدة</li></ul></li>
<li><p>أربع سير قُيّمت كل منها مرتين: (70، 73) و(55، 54) و(81، 85) و(62، 62). ما تباين التشغيلين كما حُسب في المقرر؟</p><ul><li><b>أ.</b> صفر</li><li><b>ب.</b> نقطتان</li><li><b>ج.</b> أربع نقاط</li><li><b>د.</b> ثماني نقاط</li></ul></li>
<li><p>اختبار فيه ثلاثة أزواج للجنس. فروقها (المعدَّلة ناقص المرجعية): نزول 4، ونزول 3.5، ونزول 5. تباين التشغيلين 2. ما القراءة بقاعدة المقرر؟</p><ul><li><b>أ.</b> يُحتسب: المتوسط أكبر من التباين، والاتجاه واحد</li><li><b>ب.</b> لا يُحتسب: ثلاثة أزواج أقل من أن يُبنى عليها</li><li><b>ج.</b> لا يُحتسب: الفروق الثلاثة ليست متساوية الحجم</li><li><b>د.</b> يُحتسب، ويثبت تحيز المساعد في كل مهامه</li></ul></li>
<li><p>اختبار من عشرة أزواج قُيّم كل منها مرتين لم يجد فرقًا يتجاوز التباين في أي نوع. أي جملة تصلح للمحضر؟</p><ul><li><b>أ.</b> ثبت بالاختبار أن المساعد خالٍ من التحيز في الاسم والجنس والعمر</li><li><b>ب.</b> يُعتمد المساعد لفرز الطلبات بعد أن اجتاز اختبار الأزواج العشرة</li><li><b>ج.</b> لم يظهر فرق يتجاوز التباين في عشرة أزواج، وهذا لا ينفي فرقًا صغيرًا</li><li><b>د.</b> الاختبار لم ينجح، ويُعاد بأمر آخر إلى أن يظهر فرق في نوع ما</li></ul></li>
<li><p>لماذا تُقيَّم كل سيرة في محادثة جديدة؟</p><ul><li><b>أ.</b> لأن المحادثة الطويلة تبطئ المساعد كثيرًا</li><li><b>ب.</b> لأن المساعد ينسى الأمر بعد سيرتين أو ثلاث</li><li><b>ج.</b> لأن السيرة الثانية تُقيَّم وهي ترى الأولى</li><li><b>د.</b> لأن ذلك يحمي بيانات أصحاب السير من التسرب</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: تقييم منصف، وبيانات موظفين محمية، وإعادة تصميم تُقاس</h2>
<ol>
<li><p>زميل في جهة أخرى اختبر مساعده: سيرتان تختلفان في الاسم الأول، رجل وامرأة، وتشغيل واحد. خرجت الدرجتان 82 و82. كتب في محضره: «اختُبر المساعد ولا تحيز فيه». ما أدق رد؟</p><ul><li><b>أ.</b> النتيجة سليمة: الدرجتان متساويتان تمامًا في الزوج</li><li><b>ب.</b> الأزواج المتطابقة لا تصلح أصلًا لاختبار مساعد</li><li><b>ج.</b> يكفي أن يعيد التشغيل مرة ثانية ليثبت ما كتبه</li><li><b>د.</b> لم يظهر فرق في زوج واحد، ولم يُختبر غير الجنس</li></ul></li>
<li><p>المعيار: أخلاقيات البيانات وحمايتها، بمستوى متوسط. أي سؤال يقيسه ويمكن تقدير إجابته على مرتكزات؟</p><ul><li><b>أ.</b> ما رأيك في أهمية خصوصية البيانات في عمل المحلل اليوم؟</li><li><b>ب.</b> وصلك ملف شكاوى فيه أسماء العملاء وهواتفهم. ماذا تفعل أولًا؟</li><li><b>ج.</b> هل قرأت نظام حماية البيانات الشخصية ولائحته التنفيذية؟</li><li><b>د.</b> هل تتعهد بالحفاظ على سرية بيانات الشركة وعملائها دائمًا؟</li></ul></li>
<li><p>ملف موظف في وحدة من ثلاثة محللين. حُذف منه الاسم والرقم الوظيفي والهوية والجوال والبريد، وبقي: «محلل بيانات، وحدة تخطيط الإمداد، مدة الخدمة أربع عشرة سنة، المستوى في لوحات المعلومات 1». أي جملة تصف هذا الملف؟</p><ul><li><b>أ.</b> ما زال يدل على صاحبه: مدة الخدمة الدقيقة تميّزه</li><li><b>ب.</b> صار مخفي الهوية: لم يبق فيه معرِّف مباشر واحد</li><li><b>ج.</b> يجب حذف مستوى لوحات المعلومات لأنه تقييم للموظف</li><li><b>د.</b> يكفي حذف اسم الوحدة، فهو ما يدل على مكان الموظف</li></ul></li>
<li><p>ملف مرمَّز: مدة الخدمة أقل من سنتين. الفجوات: تنظيف البيانات، والتحليل الاستكشافي، والاستعلام، وأخلاقيات البيانات. لا فجوة في لوحات المعلومات ولا في عرض النتائج. أي سطر يُحذف من الخطة؟</p><ul><li><b>أ.</b> ورشة في حماية البيانات، ثم قائمة فحص تُطبق على كل ملف يخرج من الوحدة</li><li><b>ب.</b> تنظيف ملف شهري كامل بمراجعة زميل، حتى يُعاد تنفيذ ملفين دون سؤال</li><li><b>ج.</b> لأنه جديد في الوحدة، دورة متقدمة في لوحات المعلومات تثبت جديته</li><li><b>د.</b> تمارين أسبوعية في الاستعلام، حتى تدخل ثلاثة استعلامات تقريرًا شهريًا</li></ul></li>
<li><p>أعادت زميلة تصميم مهمة تلخيص استبيان الموظفين الجدد. خط الأساس: 60 دقيقة وخطأ واحد. بعد إعادة التصميم: 25 دقيقة وثلاثة أخطاء. لم تقس الإنصاف. ما القرار الذي يسنده القياس؟</p><ul><li><b>أ.</b> لا يُعتمد بعد: تُضاف مراجعة ومقياس إنصاف ثم يُقاس</li><li><b>ب.</b> يُعتمد التصميم: الوقت قلّ بأكثر من النصف في التنفيذ</li><li><b>ج.</b> يُترك المساعد في هذه المهمة نهائيًا: أخطاؤه تضاعفت</li><li><b>د.</b> يُعتمد التصميم ويُذكر الوقت وحده في البطاقة</li></ul></li>
<li><p>أي مرتكز للدرجة 5 يصلح لسؤال عن عرض نتيجة تحليل على غير المختصين؟</p><ul><li><b>أ.</b> واثق من نفسه ولبق في حديثه مع اللجنة</li><li><b>ب.</b> أعجب عرضه أعضاء اللجنة جميعًا بلا استثناء</li><li><b>ج.</b> يشبه في أسلوبه أفضل المحللين في الوحدة</li><li><b>د.</b> بدأ بالتوصية، ثم دليلها في رقمين</li></ul></li>
<li><p>مرشح لم يُختر كتب يسأل عن السبب. اللجنة قابلته بدليل فيه مرتكزات، والمساعد أعدّ مسودة الأسئلة فقط. من أين يأتي الجواب؟</p><ul><li><b>أ.</b> من المساعد: يُطلب منه سبب مقنع يُرسل إلى المرشح</li><li><b>ب.</b> من ملاحظات اللجنة: المعيار الذي لم يُستوفَ</li><li><b>ج.</b> لا يُجاب المرشح: أسباب قرارات التوظيف سرية</li><li><b>د.</b> من سيرته: يُبحث فيها عن نقص يصلح سببًا للرد</li></ul></li>
<li><p>رُمّز ملف موظف: الاسم صار رمزًا، وجدول الرموز محفوظ في نظام الموارد البشرية. أي وصف يطابق ما عُرض في المقرر من اللائحة التنفيذية؟</p><ul><li><b>أ.</b> مرمَّز، ويبقى بيانات شخصية ما دام المفتاح موجودًا</li><li><b>ب.</b> مخفي الهوية: لم يبق فيه اسم ولا رقم يدل على صاحبه</li><li><b>ج.</b> بيانات عامة بعد الترميز، ويجوز لصقه في أي مساعد</li><li><b>د.</b> بيانات حساسة: كل ملف موظف حساس بطبيعته في النظام</li></ul></li>
<li><p>ملاحظة مدير: «هي الوحيدة في القسم التي تعمل بدوام جزئي بعد عودتها من إجازة الأمومة، وتحتاج إلى تدريب على النظام الجديد». ما الذي يدخل أمر خطة التعلم؟</p><ul><li><b>أ.</b> الملاحظة كلها كما كتبها المدير، بعد حذف اسم الموظفة منها</li><li><b>ب.</b> «فجوة في استخدام النظام الجديد»، مكتوبة من جديد</li><li><b>ج.</b> «تعمل بدوام جزئي وتحتاج إلى تدريب على النظام الجديد»</li><li><b>د.</b> «عادت من إجازة أمومة وتحتاج إلى تدريب على النظام»</li></ul></li>
<li><p>ملف مرمَّز فيه: مدة الخدمة أكثر من 10 سنوات، وفجوة واحدة في لوحات المعلومات. اقترح المساعد: «نظرًا إلى خبرته الطويلة، يُعفى من التدريب على الأدوات الجديدة». ما العيب؟</p><ul><li><b>أ.</b> لا عيب فيه: السطر يراعي خبرته الطويلة</li><li><b>ب.</b> السطر أطول من أن يدخل خطة من ثلاثة أسطر</li><li><b>ج.</b> يذكر مدة الخدمة، وهي معرِّف مباشر للموظف</li><li><b>د.</b> يحكم على الشخص من مدة خدمته ويترك فجوته</li></ul></li>
<li><p>أي مهمة تصلح لبطاقة إعادة تصميم في هذا المقرر؟</p><ul><li><b>أ.</b> اختيار من يُرقّى من قائمة المرشحين للترقية</li><li><b>ب.</b> تقدير درجات الأداء السنوية لموظفي الإدارة</li><li><b>ج.</b> مسودة إعلان داخلي لكل شاغر من بطاقة دوره</li><li><b>د.</b> تحديد من تنتهي عقودهم في نهاية كل عام</li></ul></li>
<li><p>المهمة: رسائل دعوة إلى المقابلة يصوغها المساعد. أي مقياس إنصاف يصلح للبطاقة؟</p><ul><li><b>أ.</b> كم زوجًا من المدعوين المتماثلين خرجت رسالتاه بالمعلومات نفسها؟</li><li><b>ب.</b> نحرص على أن تكون الرسائل لطيفة وواضحة مع جميع المدعوين</li><li><b>ج.</b> كم رسالة دعوة تُكتب وتُرسل في الساعة الواحدة بعد التصميم؟</li><li><b>د.</b> ما درجة رضا مدير التوظيف عن صياغة الرسائل من خمس درجات؟</li></ul></li>
<li><p>خط الأساس: 80 دقيقة وخطآن وإنصاف 3 من 3. بعد إعادة التصميم، تنفيذان: (40 دقيقة، خطآن، 3 من 3) و(44 دقيقة، خطأ واحد، 3 من 3). أي قراءة تُكتب في البطاقة؟</p><ul><li><b>أ.</b> وفّر المساعد 50% من وقت المهمة، وهذا ما يُرفع إلى الإدارة في البطاقة</li><li><b>ب.</b> المساعد يلغي الأخطاء: في التنفيذ الثاني نزلت إلى خطأ واحد فقط</li><li><b>ج.</b> قلّ الوقت إلى نحو النصف في تنفيذين، ولم تزد الأخطاء ولم يتغير الإنصاف</li><li><b>د.</b> لا فائدة تُذكر من إعادة التصميم: الأخطاء لم تختفِ في أي تنفيذ</li></ul></li>
<li><p>قاست زميلة وقت المساعد في كتابة المسودة: دقيقتان. خط أساسها 45 دقيقة للمهمة كلها. كتبت: «قلّ الوقت بنسبة 96%». ما الخطأ في القياس؟</p><ul><li><b>أ.</b> لا خطأ في القياس: الرقمان صحيحان والنسبة صحيحة</li><li><b>ب.</b> قاست وقت المساعد، لا وقت المهمة بمراجعتها</li><li><b>ج.</b> كان عليها أن تقيس بالثواني لتكون النسبة أدق</li><li><b>د.</b> خط أساسها مرتفع، ويجب أن تعيد قياسه أولًا</li></ul></li>
</ol>
